spring.application.name=empreende-sede-api
server.port=8080

# Perfil padrão: dev (H2 em memória). Para conectar ao Supabase, use: supabase
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Configuração H2 (Perfil dev)
spring.datasource.url=jdbc:h2:mem:empreendesede;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
