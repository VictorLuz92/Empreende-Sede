spring.application.name=empreende-sede-api
server.port=8080

# Perfil padrão: dev (H2 em memória). Para conectar ao Supabase, use: supabase
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Configuração H2 (Perfil dev)
spring.datasource.url=jdbc:h2:mem:empreendesede;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Administrador único do projeto (configure via variáveis de ambiente em produção)
app.admin.email=${APP_ADMIN_EMAIL:admin@empreendesede.com.br}
app.admin.password=${APP_ADMIN_PASSWORD:Admin@123456}
app.auth.jwt-secret=${APP_JWT_SECRET:empreende-sede-dev-secret-change-in-production-2026}

# OAuth 2.0 (Login Social com Google/Gmail e Microsoft/Outlook)
app.oauth.google-client-id=${GOOGLE_CLIENT_ID:}
app.oauth.microsoft-client-id=${MICROSOFT_CLIENT_ID:}

# Configuração Pix (R$ 50,00 = 30 dias de divulgação)
app.pix.key=${APP_PIX_KEY:admin@empreendesede.com.br}
app.pix.merchant-name=${APP_PIX_MERCHANT_NAME:EMPREENDE SEDE}
app.pix.merchant-city=${APP_PIX_MERCHANT_CITY:SAO PAULO}
app.pix.monthly-amount=50.00
app.pix.duration-days=30
