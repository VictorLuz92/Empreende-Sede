# =============================================================================
# Perfil Supabase (PostgreSQL)
# Ative com: SPRING_PROFILES_ACTIVE=supabase
# =============================================================================

spring.datasource.url=${SUPABASE_DB_URL:jdbc:postgresql://aws-0-sa-east-1.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SUPABASE_DB_USER:postgres.seu_projeto_ref}
spring.datasource.password=${SUPABASE_DB_PASSWORD:sua_senha_supabase}

# Pool HikariCP otimizado para Transaction Pooler do Supabase
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# Em produção com schema.sql já aplicado no Supabase, recomenda-se 'validate'
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
